<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- leaf growing out of the tool box (life) -->
  <path d="M34 28 C31 19 25 13 16 10 C19 19 26 25 34 28 Z" fill="url(#leaf)"/>
  <path d="M34 28 C28 25 23 21 19 15" stroke="#065f46" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- tool box body -->
  <path d="M12 28 a5 5 0 0 1 5-5 h30 a5 5 0 0 1 5 5 v18 a5 5 0 0 1-5 5 H17 a5 5 0 0 1-5-5 Z" fill="#ffffff"/>
  <!-- handle -->
  <path d="M22 28 V23 a5 5 0 0 1 5-5 h10 a5 5 0 0 1 5 5 v5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- latch -->
  <rect x="27" y="34" width="10" height="6" rx="2" fill="#2563eb"/>
</svg>
